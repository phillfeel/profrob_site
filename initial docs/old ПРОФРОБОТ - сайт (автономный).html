  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cf828e65-b77f-4b6a-a94f-9f60ad5bb76d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"214ca7bf-178c-4b9b-b112-fbe9fd593ed0\"><\u002Fscript>\n<style data-dc-atomics=\"\">\n*{box-sizing:border-box}\n.doc{font-family:'Manrope',system-ui,sans-serif;background:#E9EDF3;color:#0E1826;-webkit-font-smoothing:antialiased;min-height:100vh;padding:0 0 80px}\n/* floating index */\n.dx{position:fixed;top:20px;right:20px;width:210px;background:#fff;border:1px solid #DCE3EC;border-radius:12px;box-shadow:0 10px 34px rgba(16,30,50,.14);padding:14px 10px;z-index:60;max-height:calc(100vh - 40px);overflow:auto}\n.dx-t{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8592A4;padding:2px 8px 9px}\n.dx a{display:flex;gap:9px;align-items:baseline;text-decoration:none;color:#3A4658;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:7px;line-height:1.25}\n.dx a:hover{background:#F1F5FB;color:#1E6BFF}\n.dx a b{color:#B4C0D2;font-weight:800;font-size:11px;min-width:15px}\n/* intro */\n.wrap{max-width:1180px;margin:0 auto;padding:0 24px}\n.intro{padding:52px 0 8px}\n.intro .kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1E6BFF;margin-bottom:16px}\n.intro h1{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.08;margin:0 0 16px;max-width:820px}\n.intro .sub{font-size:16.5px;line-height:1.6;color:#4C5A6C;max-width:720px;margin:0}\n.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:34px 0 8px}\n.ds-c{background:#fff;border:1px solid . Средняя детализация, адаптив (десктоп + мобайл). Изображения — плейсхолдеры под реальные фото.<\u002Fp>\n<div class=\"ds\">\n<div class=\"ds-c\"><h4>Палитра<\u002Fh4><div class=\"sw\"><i style=\"background:#0B1424\"><\u002Fi><i style=\"background:#14243A\"><\u002Fi><i style=\"background:#1E6BFF\"><\u002Fi><i style=\"background:#EAF1FF\"><\u002Fi><i style=\"background:#F4F8FC\"><\u002Fi><i style=\"background:#0E1826\"><\u002Fi><i style=\"background:#5A6675\"><\u002Fi><i style=\"background:#E4E9F0\"><\u002Fi><\u002Fdiv><p style=\"margin-top:12px;font-size:12px;color:#6C7889;line-height:1.5\">Тёмно-синий фон, синий акцент #1E6BFF, светлые секции, графитовый текст.<\u002Fp><\u002Fdiv>\n<div class=\"ds-c ds-type\"><h4>Типографика<\u002Fh4><div class=\"a\">Manrope<\u002Fdiv><div class=\"b\">800 · 700 — заголовки<br>500 · 400 — текст<\u002Fdiv><p style=\"margin-top:12px;font-size:12px;color:#6C7889;line-height:1.5\">Гротеск с сильной кириллицей, язык инженеров-практиков.<\u002Fp><\u002Fdiv>\n<div class=\"ds-c\"><h4>Компоненты<\u002Fh4><p class=\"ds-list\"><b>Карточки<\u002Fb> с иконкой (Lucide), радиус 12–13px · <b>кнопки<\u002Fb> синяя/контурная · <b>тёмные плашки<\u002Fb> с цифрами · <b>плитки<\u002Fb> отраслей · сквозные <b>CTA<\u002Fb>.<\u002Fp><\u002Fdiv>\n<div class=\"ds-c\"><h4>4 сквозных CTA<\u002Fh4><p class=\"ds-list\"><b>Рассчитать ROI<\u002Fb> · Подобрать решение · Запросить КП · Демо и пилот. Минимум один виден без прокрутки и один в конце страницы.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"ptype\" id=\"home\">\n<div class=\"ptlabel\"><div class=\"ptnum\">01<\u002Fdiv><div class=\"ptmeta\"><h2>Главная<\u002Fh2><p class=\"use\">Единственная точка входа и распределитель трафика. Задаёт всю дизайн-систему сайта. <b>URL:<\u002Fb> /<\u002Fp><\u002Fdiv><div class=\"pttag pt-com\">Коммерческая + доверие<\u002Fdiv><\u002Fdiv>\n<div class=\"frame\">\n<div class=\"frbar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><div class=\"frurl\">profrobot.ru<b><\u002Fb><\u002Fdiv><\u002Fdiv>\n<div class=\"pg\">\n<dc-import name=\"Профробот Шапка\" theme=\"dark\" hint-size=\"100%,66px\"><\u002Fdc-import>\n<div class=\"hero\"><div class=\"hero-bg\"><\u002Fdiv>\n<div class=\"hero-in\">\n<div><h1>Роботизация и автоматизация процессов <span class=\"bl\">для измеримого результата бизнеса<\u002Fspan><\u002Fh1>\n<p>Внедряем роботизированные системы, которые снижают затраты до 30%, закрывают дефицит персонала и делают качество услуг стабильным. Считаем экономику до вложений — вы видите окупаемость заранее.<\u002Fp>\n<div class=\"btns\"><a class=\"btn btn-pri\" href=\"#roi\"><i data-lucide=\"calculator\"><\u002Fi>Рассчитать экономический эффект (ROI)<\u002Fa><a class=\"btn btn-gho\" href=\"#cases\"><i data-lucide=\"play\"><\u002Fi>Посмотреть кейсы<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hero-widget\"><div class=\"hw-t\">ПРОФРОБОТ — единый центр управления<\u002Fdiv>\n<div class=\"hw-g\"><div class=\"hw-c\"><div class=\"hw-n\">142<\u002Fdiv><div class=\"hw-l\">устройства<\u002Fdiv><\u002Fdiv><div class=\"hw-c\"><div class=\"hw-n\">14<\u002Fdiv><div class=\"hw-l\">объектов<\u002Fdiv><\u002Fdiv><div class=\"hw-c\"><div class=\"hw-n\">98,2<span class=\"u\">%<\u002Fspan><\u002Fdiv><div class=\"hw-l\">SLA и качество<\u002Fdiv><\u002Fdiv><div class=\"hw-c\"><div class=\"hw-n\">24<\u002Fdiv><div class=\"hw-l\">активные операции<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"hw-b\"><i><\u002Fi>Все операции под контролем 24/7<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"logobar\"><span class=\"lb-t\">Работаем с ведущими мировыми производителями<\u002Fspan><b>PUDU<\u002Fb><b>GAUSIUM<\u002Fb><b>KEENON<\u002Fb><b>HIKROBOT<\u002Fb><b>FORWARDX<\u002Fb><b>UNITREE<\u002Fb><b>ORIONSTAR<\u002Fb><a href=\"#vendors\">и другие →<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\">\n<div class=\"head-c\"><span class=\"eyebrow\">С чего начать<\u002Fspan><h2 class=\"h2 h2c\">Какие задачи вы хотите решить?<\u002Fh2><p class=\"lead lead-c\">Начните с задачи — решение подберём под неё, а не наоборот.<\u002Fp><\u002Fdiv>\n<div class=\"grid6\">\n<div class=\"card\"><div class=\"chip\"><i data-lucide=\"user-x\"><\u002Fi><\u002Fdiv><h3>Не хватает персонала<\u002Fh3><p>Линейных сотрудников всё сложнее найти и дороже удерживать. Робот берёт на себя рутину и снижает зависимость объекта от ручного труда и текучки.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"chip\"><i data-lucide=\"wallet\"><\u002Fi><\u002Fdiv><h3>Высокая стоимость эксплуатации<\u002Fh3><p>Пересчитываем расходы на уборку и обслуживание. На типовых объектах эксплуатация сокращается на 30% и более.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"chip\"><i data-lucide=\"badge-check\"><\u002Fi><\u002Fdiv><h3>Нестабильное качество<\u002Fh3><p>Результат не должен зависеть от смены, настроения или опыта конкретного человека. Робот работает по одному стандарту каждый день.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"chip\"><i data-lucide=\"eye\"><\u002Fi><\u002Fdiv><h3>Нет прозрачности и контроля<\u002Fh3><p>Видно, что происходит на объекте прямо сейчас: где убрано, что пропущено, сколько сделано. Объективные данные вместо «вроде всё нормально».<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"chip\"><i data-lucide=\"moon\"><\u002Fi><\u002Fdiv><h3>Процессы мешают бизнесу<\u002Fh3><p>Настраиваем работу в ночь и непиковые часы, чтобы уборка и логистика не пересекались с потоком клиентов и производством.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"chip\"><i data-lucide=\"layers\"><\u002Fi><\u002Fdiv><h3>Сложно масштабировать<\u002Fh3><p>Один объект — понятно. Пять объектов — уже хаос. Единая платформа держит весь парк под контролем из одного центра.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-alt\">\n<div class=\"head-c\"><span class=\"eyebrow\">Процесс<\u002Fspan><h2 class=\"h2 h2c\">Как проходит внедрение<\u002Fh2><p class=\"lead lead-c\">От первого аудита до сервиса по SLA — шесть шагов, на каждом вы видите цифры.<\u002Fp><\u002Fdiv>\n<div class=\"steps\">\n<div class=\"step\"><div class=\"step-n\">1<\u002Fdiv><h4>Аудит и анализ<\u002Fh4><p>Выезжаем на объект, разбираем процессы и цифры. Считаем, где теряются деньги и каким будет ROI.<\u002Fp><\u002Fdiv>\n<div class=\"step\"><div class=\"step-n\">2<\u002Fdiv><h4>Подбор решения<\u002Fh4><p>Оборудование и сценарии под задачу, а не «что есть в наличии». Техника от 2–5 производителей.<\u002Fp><\u002Fdiv>\n<div class=\"step\"><div class=\"step-n\">3<\u002Fdiv><h4>Пилотный проект<\u002Fh4><p>Запускаем на реальном участке и подтверждаем экономику до крупных вложений.<\u002Fp><\u002Fdiv>\n<div class=\"step\"><div class=\"step-n\">4<\u002Fdiv><h4>Внедрение под ключ<\u002Fh4><p>Поставка, настройка, интеграция с инфраструктурой, обучение персонала и запуск.<\u002Fp><\u002Fdiv>\n<div class=\"step\"><div class=\"step-n\">5<\u002Fdiv><h4>Сервис и поддержка<\u002Fh4><p>SLA, техподдержка, обслуживание, обновления. Собственная сервисная сеть по России.<\u002Fp><\u002Fdiv>\n<div class=\"step\"><div class=\"step-n\">6<\u002Fdiv><h4>Аналитика и развитие<\u002Fh4><p>Смотрим на данные эксплуатации, дорабатываем сценарии и масштабируем на другие объекты.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-dark\">\n<div class=\"head-c\"><span class=\"eyebrow\">Результат<\u002Fspan><h2 class=\"h2 h2c\">Результат, который получает бизнес<\u002Fh2><\u002Fdiv>\n<div class=\"rstats\">\n<div class=\"rstat\"><i data-lucide=\"trending-down\"><\u002Fi><div class=\"n\">до 30%<\u002Fdiv><div class=\"l\">снижение затрат на эксплуатацию<\u002Fdiv><\u002Fdiv>\n<div class=\"rstat\"><i data-lucide=\"users\"><\u002Fi><div class=\"n\">до 80%<\u002Fdiv><div class=\"l\">снижение зависимости от ручного труда<\u002Fdiv><\u002Fdiv>\n<div class=\"rstat\"><i data-lucide=\"badge-check\"><\u002Fi><div class=\"n\">98%+<\u002Fdiv><div class=\"l\">стабильное качество уборки и услуг<\u002Fdiv><\u002Fdiv>\n<div class=\"rstat\"><i data-lucide=\"clock\"><\u002Fi><div class=\"n\">24/7<\u002Fdiv><div class=\"l\">автономная работа без перерывов<\u002Fdiv><\u002Fdiv>\n<div class=\"rstat\"><i data-lucide=\"activity\"><\u002Fi><div class=\"n\">100%<\u002Fdiv><div class=\"l\">прозрачность и контроль в реальном времени<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"lead lead-c\" style=\"font-size:13px;margin-top:26px\">Диапазоны рассчитываются на аудите под конкретный объект.<\u002Fp>\n<\u002Fdiv>\n<div class=\"s\">\n<div class=\"head-l\"><span class=\"eyebrow\">Доказательства<\u002Fspan><h2 class=\"h2\">Кейсы и результаты<\u002Fh2><\u002Fdiv>\n<div class=\"grid4\">\n<div class=\"casecard\"><div class=\"cc-img ph\"><span class=\"ph-lbl\">фото · бизнес-центр<\u002Fspan><\u002Fdiv><div class=\"cc-b\"><span class=\"cc-tag\">Бизнес-центр<\u002Fspan><h4>Снижение затрат на клининг на 32%<\u002Fh4><a class=\"cc-link\" href=\"#case\">Смотреть кейс <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv><\u002Fdiv>\n<div class=\"casecard\"><div class=\"cc-img ph\"><span class=\"ph-lbl\">фото · торговый центр<\u002Fspan><\u002Fdiv><div class=\"cc-b\"><span class=\"cc-tag\">Торговый центр<\u002Fspan><h4>Оптимизация уборки в ночное время<\u002Fh4><a class=\"cc-link\" href=\"#case\">Смотреть кейс <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv><\u002Fdiv>\n<div class=\"casecard\"><div class=\"cc-img ph\"><span class=\"ph-lbl\">фото · склад<\u002Fspan><\u002Fdiv><div class=\"cc-b\"><span class=\"cc-tag\">Складской комплекс<\u002Fspan><h4>Рост пропускной способности склада на 35%<\u002Fh4><a class=\"cc-link\" href=\"#case\">Смотреть кейс <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv><\u002Fdiv>\n<div class=\"casecard\"><div class=\"cc-img ph\"><span class=\"ph-lbl\">фото · стройка<\u002Fspan><\u002Fdiv><div class=\"cc-b\"><span class=\"cc-tag\">Строительный объект<\u002Fspan><h4>Снижение трудозатрат на демонтаж на 40%<\u002Fh4><a class=\"cc-link\" href=\"#case\">Смотреть кейс <i data-lucide=\"arrow-right\"><\u0 card\"><div class=\"chip\"><i data-lucide=\"layout-grid\"><\u002Fi><\u002Fdiv><h3>Fleet Management<\u002Fh3><p>Управление парком устройств на нескольких объектах из одного центра.<\u002Fp><a class=\"cc-link\" href=\"#platform\">Подробнее <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"repeat\"><\u002Fi><\u002Fdiv><h3>Robot as a Service (RaaS)<\u002Fh3><p>Аренда роботов вместо покупки. Ниже барьер входа, быстрее старт, платите за использование.<\u002Fp><a class=\"cc-link\" href=\"#roi\">Узнать про аренду <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"wrench\"><\u002Fi><\u002Fdiv><h3>Retrofit<\u002Fh3><p>Модернизация существующей техники: камеры, навигация, датчики. Часто быстрее и дешевле, чем покупать нового робота.<\u002Fp><a class=\"cc-link\" href=\"#contacts\">Подробнее <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"brain\"><\u002Fi><\u002Fdiv><h3>AI-модули и аналитика<\u002Fh3><p>Распознавание, сценарии и аналитика эксплуатации поверх базового оборудования.<\u002Fp><a class=\"cc-link\" href=\"#platform\">Подробнее <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"route\"><\u002Fi><\u002Fdiv><h3>Диспетчеризация и мониторинг<\u002Fh3><p>Контроль операций и распределение задач между устройствами.<\u002Fp><a class=\"cc-link\" href=\"#platform\">Подробнее <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"plug\"><\u002Fi><\u002Fdiv><h3>Open API и интеграции<\u002Fh3><p>Стыковка с ERP, BMS и учётными системами клиента.<\u002Fp><a class=\"cc-link\" href=\"#platform\">Подробнее <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-alt\">\n<span class=\"eyebrow\">Аргументы против «дорого»<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:24px\">Начать без крупных вложений<\u002Fh2>\n<div class=\"split2\">\n<div class=\"card\" style=\"padding:28px\"><div class=\"chip\"><i data-lucide=\"repeat\"><\u002Fi><\u002Fdiv><h3 style=\"font-size:19px;margin-top:14px\">RaaS — аренда вместо покупки<\u002Fh3><p style=\"font-size:14px\">Убирает крупные разовые вложения. Платите за использование, старт быстрее, риск ниже. Сильный вход для сезонного бизнеса и пилота.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"padding:28px\"><div class=\"chip\"><i data-lucide=\"wrench\"><\u002Fi><\u002Fdiv><h3 style=\"font-size:19px;margin-top:14px\">Retrofit — модернизация вашей техники<\u002Fh3><p style=\"font-size:14px\">Позволяет не выбрасывать уже купленное оборудование. Добавляем навигацию, датчики и полуавтоматические сценарии — дешевле нового робота.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\" style=\"padding-bottom:0\">\n<div class=\"ctarow\"><div><h3>Хотите начать без крупных вложений?<\u002Fh3><p>Расскажем про аренду роботов (RaaS) и посчитаем модель под ваш объект.<\u002Fp><\u002Fdiv><div class=\"btns\"><a class=\"btn btn-pri\" href=\"#roi\">Узнать про аренду <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\">\n<div class=\"xlinks\"><a class=\"xlink\" href=\"#hub\"><span class=\"chip\"><i data-lucide=\"settings-2\"><\u002Fi><\u002Fspan><span><b>Решения<\u002Fb><span>Технологические направления<\u002Fspan><\u002Fspan><span class=\"ar\"><i data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan><\u002Fa><a class=\"xlink\" href=\"#services\"><span class=\"chip\"><i data-lucide=\"list-checks\"><\u002Fi><\u002Fspan><span><b>Услуги<\u002Fb><span>Полный цикл внедрения<\u002Fspan><\u002Fspan><span class=\"ar\"><i data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Профробот Подвал\" hint-size=\"100%,360px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"ptype\" id=\"platform\">\n<div class=\"ptlabel\"><div class=\"ptnum\">05<\u002Fdiv><div class=\"ptmeta\"><h2>Платформа<\u002Fh2><p class=\"use\">Карточка флагманского продукта. Главный аргумент против «поставят и бросят» и отличие от реселлеров. Тот же шаблон подходит для других продуктовых страниц. <b>URL:<\u002Fb> /produkty/cleaning-operations-platform/<\u002Fp><\u002Fdiv><div class=\"pttag pt-com\">Коммерческая + доверие<\u002Fdiv><\u002Fdiv>\n<div class=\"frame\">\n<div class=\"frbar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><div class=\"frurl\">profrobot.ru/produkty/<b>cleaning-operations-platform/<\u002Fb><\u002Fdiv><\u002Fdiv>\n<div class=\"pg\">\n<dc-import name=\"Профробот Шапка\" hint-size=\"100%,66px\"><\u002Fdc-import>\n<div class=\"s s-dark\" style=\"padding-top:26px\">\n<div class=\"crumbs\" style=\"padding:0 0 22px;color:#7C90AC\"><a href=\"#home\" style=\"color:#7C90AC\">Главная<\u002Fa><span style=\"color:#3A4A60\">/<\u002Fspan><a href=\"#products\" style=\"color:#7C90AC\">Продукты<\u002Fa><span style=\"color:#3A4A60\">/<\u002Fspan>Платформа<\u002Fdiv>\n<div class=\"split2\">\n<div><span class=\"eyebrow\">Флагманский продукт · российская разработка<\u002Fspan><h2 class=\"h2\" style=\"color:#fff;font-size:33px\">PROFROBOT Cleaning Operations Platform<\u002Fh2><p class=\"lead\" style=\"font-size:17px;color:#C6D4E8\">Единая платформа управления роботизированным клинингом, техникой и эксплуатацией объектов.<\u002Fp><p class=\"lead\">Поставить робота-уборщика — половина дела. Платформа собирает всё в одно окно: парк техники, задачи, качество, аналитику и сервис. По сути это операционная система автономного клининга.<\u002Fp><div class=\"btns\"><a class=\"btn btn-pri\" href=\"#contacts\"><i data-lucide=\"play\"><\u002Fi>Запросить демо платформы<\u002Fa><a class=\"btn btn-gho\" href=\"#roi\">Рассчитать ROI объекта<\u002Fa><\u002Fdiv><\u002Fdiv>\n<div class=\"ph dark\" style=\"height:320px\"><span class=\"ph-lbl\">скриншот · единый центр управления<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\">\n<div class=\"split2\"><div><span class=\"eyebrow\">Главная идея<\u002Fspan><h2 class=\"h2\">Управляем не роботами, а качеством и результатом<\u002Fh2><\u002Fdiv><p class=\"lead\" style=\"margin-top:0\">Робот — это инструмент. Ценность появляется, когда за ним стоит система: она распределяет задачи, следит за выполнением, ловит отклонения и показывает объективную картину эксплуатации. Один оператор через платформу контролирует десятки устройств сразу — без раздувания штата.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-alt\" style=\"padding-top:34px;padding-bottom:34px\">\n<span class=\"eyebrow\">Для каких объектов<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:20px\">Коммерческая недвижимость и общественные пространства<\u002Fh2>\n<div class=\"tags\"><span class=\"tag\">Бизнес-центры и офисы<\u002Fspan><span class=\"tag\">Торговые центры<\u002Fspan><span class=\"tag\">Склады и логистика<\u002Fspan><span class=\"tag\">Отели<\u002Fspan><span class=\"tag\">Клиники<\u002Fspan><span class=\"tag\">Аэропорты<\u002Fspan><span class=\"tag\">Фитнес-клубы<\u002Fspan><span class=\"tag\">Образование<\u002Fspan><span class=\"tag\">Общественные пространства<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\">\n<span class=\"eyebrow\">Возможности<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:28px\">Ключевые возможности платформы<\u002Fh2>\n<div class=\"grid3\">\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"layout-dashboard\"><\u002Fi><\u002Fdiv><h3>Единый центр управления<\u002Fh3><p>Одна панель на все объекты: карта, статусы устройств, задачи, уведомления и аналитика — весь парк в реальном времени.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"layout-grid\"><\u002Fi><\u002Fdiv><h3>Управление парком техники<\u002Fh3><p>Сотни устройств: группировка по объектам, массовые команды, удалённая настройка, обновления и расписания.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"activity\"><\u002Fi><\u002Fdiv><h3>Круглосуточный мониторинг<\u002Fh3><p>Живая телеметрия, карта операций, контроль ошибок, время безотказной работы и уведомления о сбоях.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"map\"><\u002Fi><\u002Fdiv><h3>Цифровые карты и навигация<\u002Fh3><p>Карта объекта с рабочими зонами, маршрутами и запретными зонами (no-go), онлайн-редактирование из облака.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"route\"><\u002Fi><\u002Fdiv><h3>Распределение задач<\u002Fh3><p>Платформа сама строит расписание и координирует несколько роботов, чтобы они не мешали друг другу и покрывали площадь без пропусков.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"satellite-dish\"><\u002Fi><\u002Fdiv><h3>Удалённое управление<\u002Fh3><p>Запуск и остановка задач, диагностика и аварийная остановка — из любой точки, без выезда на объект.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"brain-circuit\"><\u002Fi><\u002Fdiv><h3>AI-аналитика и предиктив<\u002Fh3><p>Анализ загрузки, эффективности маршрутов, тепловые карты. Система сигналит об обслуживании до поломки, а не после.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"bot\"><\u002Fi><\u002Fdiv><h3>AI-агенты собственной разработки<\u002Fh3><p>В реальном времени находят проблемные зоны, фиксируют отклонения и дают рекомендации по оптимизации уборки.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"plug\"><\u002Fi><\u002Fdiv><h3>Open API и интеграции<\u002Fh3><p>Стыковка с BMS, IoT, системами безопасности, ERP и facility-платформами. Встраивается в инфраструктуру, а не заменяет её.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-dark\">\n<div class=\"split2\"><div><span class=\"eyebrow\">Безопасность данных<\u002Fspan><h2 class=\"h2\" style=\"color:#fff\">Российская платформа. Данные в РФ<\u002Fh2><div class=\"res-list\" style=\"margin-top:22px\"><div style=\"color:#C6D4E8\"><i data-lucide=\"shield-check\" style=\"color:#5B9CFF\"><\u002Fi>Полностью российская IT-разработка для корпоративных заказчиков<\u002Fdiv><div style=\"color:#C6D4E8\"><i data-lucide=\"server\" style=\"color:#5B9CFF\"><\u002Fi>Данные хранятся в облаке на территории России, дата-центр в Сколково<\u002Fdiv><div style=\"color:#C6D4E8\"><i data-lucide=\"lock\" style=\"color:#5B9CFF\"><\u002Fi>Защищённые каналы, резервирование, enterprise-grade безопасность<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"ph dark\" style=\"height:220px\"><span class=\"ph-lbl\">схема · дата-центр в РФ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\">\n<span class=\"eyebrow\">Результат и экономика<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:24px\">Платформа, ориентированная на результат<\u002Fh2>\n<div class=\"res-list\"><div><i data-lucide=\"check-circle-2\"><\u002Fi>Один оператор — десятки роботов: меньше людей на контроль<\u002Fdiv><div><i data-lucide=\"check-circle-2\"><\u002Fi>Нормированный расход воды и химии, эффективная эксплуатация<\u002Fdiv><div><i data-lucide=\"check-circle-2\"><\u002Fi>Стабильное качество — каждая операция по сценарию<\u002Fdiv><div><i data-lucide=\"check-circle-2\"><\u002Fi>Прозрачность: объективные отчёты, KPI, контроль подрядчиков<\u002Fdiv><div><i data-lucide=\"check-circle-2\"><\u002Fi>Больше времени безотказной работы за счёт предиктива<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-alt\">\n<span class=\"eyebrow\">По типам объектов<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:26px\">Преимущества по типам объектов<\u002Fh2>\n<div class=\"grid3\">\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"building-2\"><\u002Fi><\u002Fdiv><h3>Офисы и бизнес-центры<\u002Fh3><p>Уборка вне рабочего времени, стабильное качество, прозрачный контроль подрядчик 2Fdiv><div class=\"l\">опыта в роботизации<\u002Fdiv><\u002Fdiv><div><div class=\"n\">РФ<\u002Fdiv><div class=\"l\">собственная сервисная сеть<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-alt\">\n<span class=\"eyebrow\">Наш подход<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:26px\">Пять принципов, по которым работаем<\u002Fh2>\n<div class=\"grid3\">\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"target\"><\u002Fi><\u002Fdiv><h3>Продаём результат, а не робота<\u002Fh3><p>Разговор начинается с вашей экономики, а не с характеристик техники.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"unlink\"><\u002Fi><\u002Fdiv><h3>Независимость от производителя<\u002Fh3><p>Берём оборудование у тех, кто реально подходит и обслуживается. На каждое направление — несколько вендоров.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"ruler\"><\u002Fi><\u002Fdiv><h3>Инженерия важнее продаж<\u002Fh3><p>Если роботизация вам не окупится, мы скажем это прямо. Плохой проект вредит и вам, и нашей репутации.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"life-buoy\"><\u002Fi><\u002Fdiv><h3>Сервис — часть решения<\u002Fh3><p>Робот без обслуживания встаёт. Мы отвечаем за то, чтобы он работал, а не только за поставку.<\u002Fp><\u002Fdiv>\n<div class=\"dircard\"><div class=\"chip\"><i data-lucide=\"bar-chart-3\"><\u002Fi><\u002Fdiv><h3>Каждый проект — с измеримым результатом<\u002Fh3><p>Если эффект нельзя посчитать, проект не запускаем.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\">\n<span class=\"eyebrow\">Команда<\u002Fspan><h2 class=\"h2\" style=\"margin-bottom:26px\">Люди, которые ведут проекты<\u002Fh2>\n<div class=\"team\">\n<div class=\"tm\"><div class=\"ava ph\"><span class=\"ph-lbl\">фото<\u002Fspan><\u002Fdiv><b>Имя Фамилия<\u002Fb><span>Основатель<\u002Fspan><\u002Fdiv>\n<div class=\"tm\"><div class=\"ava ph\"><span class=\"ph-lbl\">фо u002Fdiv><\u002Fdiv>\n<div class=\"vgroup\" style=\"margin-top:26px\"><h4><i data-lucide=\"sprout\"><\u002Fi>Сельское хозяйство<\u002Fh4><div class=\"logos\"><b>XAG<\u002Fb><b>DJI Agriculture<\u002Fb><b>EAVision<\u002Fb><b>FJ Dynamics<\u002Fb><b>LJ Tech<\u002Fb><b>AI Force Tech<\u002Fb><b>Koham<\u002Fb><b>Leking<\u002Fb><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s s-alt\">\n<div class=\"split2\"><div><span class=\"eyebrow\">Как мы выбираем<\u002Fspan><h2 class=\"h2\">Подбор под задачу, а не под эксклюзив<\u002Fh2><p class=\"lead\">Основная ставка — сильные азиатские производители: лучшее соотношение цены и качества и быстрое развитие. На каждое направление держим по несколько вендоров, чтобы можно было заменить оборудование и не зависеть от одного поставщика.<\u002Fp><\u002Fdiv><div class=\"note\" style=\"align-self:center\"><b>Примечание:<\u002Fb> для сайта показываем логотипы ключевых брендов, полный перечень раскрываем по клику. Точный состав «витрины» согласуется с учётом действующих договорённостей и эксклюзивов.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\" style=\"padding-top:0\">\n<div class=\"ctarow\"><div><h3>Подобрать оборудование под задачу<\u002Fh3><p>Пройдите онлайн-подбор — предложим технику под ваш объект и экономику.<\u002Fp><\u002Fdiv><div class=\"btns\"><a class=\"btn btn-pri\" href=\"#roi\">Подобрать оборудование <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Профробот Подвал\" hint-size=\"100%,360px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"ptype\" id=\"contacts\">\n<div class=\"ptlabel\"><div class=\"ptnum\">11<\u002Fdiv><div class=\"ptmeta\"><h2>Контакты<\u002Fh2><p class=\"use\">Финальная точка конверсии. Несколько способов связи, короткая форма, честный срок ответа. <b>URL:<\u002Fb> /kontakty/<\u002Fp><\u002Fdiv><div class=\"pttag pt-com\">Коммерческая<\u002Fdiv><\u002Fdiv>\n<div class=\"frame\">\n<div class=\"frbar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><div class=\"frurl\">profrobot.ru/<b>kontakty/<\u002Fb><\u002Fdiv><\u002Fdiv>\n<div class=\"pg\">\n<dc-import name=\"Профробот Шапка\" hint-size=\"100%,66px\"><\u002Fdc-import>\n<div class=\"crumbs\"><a href=\"#home\">Главная<\u002Fa><span>/<\u002Fspan>Контакты<\u002Fdiv>\n<div class=\"s\" style=\"padding-bottom:34px\">\n<span class=\"eyebrow\">Контакты<\u002Fspan><h2 class=\"h2\">Свяжитесь с нами<\u002Fh2>\n<p class=\"lead\">Расскажите про объект и задачу — вернёмся с расчётом и предложением. Если удобнее сразу цифрами — заполните заявку на аудит, и мы посчитаем окупаемость под ваш случай.<\u002Fp>\n<\u002Fdiv>\n<div class=\"s\" style=\"padding-top:0\">\n<div class=\"split2\" style=\"align-items:start\">\n<div>\n<div class=\"ci\"><i data-lucide=\"phone\"><\u002Fi><div><b>Телефон<\u002Fb><p><a href=\"tel:+74951234567\">+7 (495) 123-45-67<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"ci\"><i data-lucide=\"mail\"><\u002Fi><div><b>E-mail<\u002Fb><p><a href=\"mailto:info@profrobot.ru\">info@profrobot.ru<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"ci\"><i data-lucide=\"send\"><\u002Fi><div><b>Мессенджеры<\u002Fb><p><a href=\"#\">Telegram<\u002Fa> · <a href=\"#\">WhatsApp<\u002Fa> — для быстрой связи<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"ci\"><i data-lucide=\"map-pin\"><\u002Fi><div><b>Адрес<\u002Fb><p>Офис в Москве · сервисная сеть по всей России<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"ci\"><i data-lucide=\"clock\"><\u002Fi><div><b>Время ответа<\u002Fb><p>Отвечаем в течение рабочего дня<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"ci\" style=\"border-bottom:none\"><i data-lucide=\"file-text\"><\u002Fi><div><b>Реквизиты<\u002Fb><p><a href=\"#\">Для юрлиц — реквизиты и договор<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"ph\" style=\"height:180px;margin-top:14px\"><span class=\"ph-lbl\">карта · офис в Москве<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"form\">\n<h3 style=\"margin:0 0 4px;font-size:18px;font-weight:800\">Оставьте заявку<\u002Fh3>\n<p style=\"margin:0 0 20px;font-size:13px;color:#6C7889\">Минимум полей — вернёмся с расчётом под ваш объект.<\u002Fp>\n<div class=\"fld-row\"><div class=\"fld\"><label>Имя<\u002Flabel><input type=\"text\" placeholder=\"Как к вам обращаться\"><\u002Fdiv><div class=\"fld\"><label>Компания<\u002Flabel><input type=\"text\" placeholder=\"Название\"><\u002Fdiv><\u002Fdiv>\n<div class=\"fld\"><label>Телефон или e-mail<\u002Flabel><input type=\"text\" placeholder=\"Куда вернуться с ответом\"><\u002Fdiv>\n<div class=\"fld\"><label>Тип объекта<\u002Flabel><select><option>Офис / бизнес-центр<\u002Foption><option>Торговый центр<\u002Foption><option>Склад<\u002Foption><option>Отель<\u002Foption><option>Клиника<\u002Foption><option>Производство<\u002Foption><option>Другое<\u002Foption><\u002Fselect><\u002Fdiv>\n<div class=\"fld\"><label>Задача<\u002Flabel><textarea placeholder=\"Коротко опишите, что хотите решить\"><\u002Ftextarea><\u002Fdiv>\n<label class=\"consent\"><input type=\"checkbox\"><span>Согласен на обработку персональных данных в соответствии с <a href=\"#\" style=\"color:#1E6BFF\">политикой конфиденциальности<\u002Fa>.<\u002Fspan><\u002Flabel>\n<button class=\"btn btn-pri\" style=\"width:100%;justify-content:center\">Отправить заявку<\u002Fbutton>\n<div class=\"minicta\"><a href=\"#roi\">Рассчитать ROI<\u002Fa><a href=\"#contacts\">Запросить КП<\u002Fa><a href=\"#platform\">Заказать демо / пилот<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Профробот Подвал\" hint-size=\"100%,360px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"ptype\" id=\"roi\">\n<div class=\"ptlabel\"><div class=\"ptnum\">12<\u002Fdiv><div class=\"ptmeta\"><h2>ROI-калькулятор<\u002Fh2><p class=\"use\">Главный инструмент конверсии — ссылается весь сайт. За 2 минуты показывает порядок экономии и захватывает лид. <b>Интерактивный.<\u002Fb> <b>URL:<\u002Fb> /roi-kalkulyator/<\u002Fp><\u002Fdiv><div class=\"pttag pt-com\">Конверсия<\u002Fdiv><\u002Fdiv>\n<div class=\"frame\">\n<div class=\"frbar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><div class=\"frurl\">profrobot.ru/<b>roi-kalkulyator/<\u002Fb><\u002Fdiv><\u002Fdiv>\n<div class=\"pg\">\n<dc-import name=\"Профробот Шапка\" hint-size=\"100%,66px\"><\u002Fdc-import>\n<div class=\"crumbs\"><a href=\"#home\">Главная<\u002Fa><span>/<\u002Fspan>ROI-калькулятор<\u002Fdiv>\n<div class=\"s\" style=\"padding-bottom:30px\">\n<span class=\"eyebrow\">Калькулятор окупаемости<\u002Fspan><h2 class=\"h2\">Рассчитайте экономический эффект за 2 минуты<\u002Fh2>\n<p class=\"lead\">Покажем порядок цифр: сколько вы тратите на ручной клининг сейчас и сколько сэкономите с роботом. Точный расчёт — на аудите под ваш объект.<\u002Fp>\n<\u002Fdiv>\n<div class=\"s\" style=\"padding-top:0\">\n<div class=\"calc\">\n<div class=\"calc-form\">\n<div class=\"cf\"><div class=\"cf-top\"><label>Тип объекта<\u002Flabel><\u002Fdiv><select value=\"{{ obj }}\" onchange=\"{{ onObj }}\"><option>Офис / бизнес-центр<\u002Foption><option>Торговый центр<\u002Foption><option>Склад<\u002Foption><option>Отель<\u002Foption><option>Клиника<\u002Foption><option>Другое<\u002Foption><\u002Fselect><\u002Fdiv>\n<div class=\"cf\"><div class=\"cf-top\"><label>Убираемая площадь<\u002Flabel><span class=\"val\">{{ areaFmt }} м²<\u002Fspan><\u002Fdiv><input class=\"rng\" type=\"range\" min=\"500\" max=\"30000\" step=\"500\" value=\"{{ area }}\" oninput=\"{{ onArea }}\"><\u002Fdiv>\n<div class=\"cf\"><div class=\"cf-top\"><label>Режим уборки<\u002Flabel><\u002Fdiv><div class=\"seg\"><button class=\"{{ modeDay }}\" onclick=\"{{ setDay }}\">Дневная<\u002Fbutton><button class=\"{{ modeNight }}\" onclick=\"{{ setNight }}\">Ночная<\u002Fbutton><button class=\"{{ modeAll }}\" onclick=\"{{ setAll }}\">Круглосуточная<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"cf\"><div class=\"cf-top\"><label>Сейчас: число уборщиков<\u002Flabel><span class=\"val\">{{ workers }}<\u002Fspan><\u002Fdiv><input class=\"rng\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"{{ workers }}\" oninput=\"{{ onWorkers }}\"><\u002Fdiv>\n<div class=\"cf\"><div class=\"cf-top\"><label>Ставка уборщика, ₽/мес<\u002Flabel><span class=\"val\">{{ wageFmt }} ₽<\u002Fspan><\u002Fdiv><input class=\"rng\" type=\"range\" min=\"30000\" max=\"120000\" step=\"5000\" value=\"{{ wage }}\" oninput=\"{{ onWage }}\"><\u002Fdiv>\n<div class=\"cf\" style=\"margin-bottom:0\"><div class=\"cf-top\"><label>Модель<\u002Flabel><\u002Fdiv><div class=\"seg\"><button class=\"{{ modelRent }}\" onclick=\"{{ setRent }}\">Аренда (RaaS)<\u002Fbutton><button class=\"{{ modelBuy }}\" onclick=\"{{ setBuy }}\">Покупка<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"res\">\n<div class=\"res-eyebrow\">Экономия в год<\u002Fdiv>\n<div class=\"res-big\">{{ economyFmt }} <small>₽<\u002Fsmall><\u002Fdiv>\n<div class=\"res-sub\">Снижение затрат ≈ {{ savePct }}%{{ paybackTxt }}<\u002Fdiv>\n<div class=\"bars\">\n<div class=\"bar\"><div class=\"bar-l\"><span>Ручной клининг сейчас<\u002Fspan><b>{{ manualFmt }} ₽/год<\u002Fb><\u002Fdiv><div class=\"bar-t\"><div class=\"bar-f now\" style=\"{{ barNow }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"bar\"><div class=\"bar-l\"><span>С роботом<\u002Fspan><b>{{ roboFmt }} ₽/год<\u002Fb><\u002Fdiv><div class=\"bar-t\"><div class=\"bar-f robo\" style=\"{{ barRobo }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"res-row\"><span>Роботов на объект<\u002Fspan><b>{{ robots }}<\u002Fb><\u002Fdiv>\n<div class=\"res-row\"><span>ФОТ сейчас (с отчислениями)<\u002Fspan><b>{{ manualFmt }} ₽<\u002Fb><\u002Fdiv>\n<div class=\"res-row\"><span>Затраты с роботом<\u002Fspan><b>{{ roboFmt }} ₽<\u002Fb><\u002Fdiv>\n<div class=\"res-cta\"><a class=\"btn btn-pri\" href=\"#contacts\"><i data-lucide=\"file-text\"><\u002Fi>Получить детальный расчёт и КП<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"margin-top:22px\">Числа демонстрационные — для оценки порядка выгоды. Реальные ставки аренды, сервиса и амортизации подставляются из вашей экономики. «Доля оператора» учитывает, что один оператор через платформу ведёт несколько объектов — на объект приходится лишь часть его ставки.<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Профробот Подвал\" hint-size=\"100%,360px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { obj:'Офис / бизнес-центр', area:5000, mode:'night', workers:2, wage:60000, model:'rent' };\n  componentDidMount(){ this._icons(); }\n  componentDidUpdate(){ this._icons(); }\n  _icons(){ if(window.lucide){ try{window.lucide.createIcons();}catch(e){} } else { setTimeout(()=>this._icons(),140); } }\n  _fmt(n){ return new Intl.NumberFormat('ru-RU').format(Math.round(n)); }\n  renderVals(){\n    const s = this.state;\n    const modeFactor = s.mode==='all' ? 1.6 : 1;\n    const robots = Math.max(1, Math.ceil(s.area/5000 * modeFactor));\n    // current manual cost\n    const manual = s.workers * s.wage * 12 * 1.3;\n    // operator share: one operator runs ~15 objects\n    const operatorYear = 120000*12*1.3;\n    const opShare = operatorYear/15;\n    const elecPerRobot = 30000;\n    let robo;\n    if(s.model==='rent'){\n      const rentMonth = 75000;\n      robo = rentMonth*12*robots + elecPerRobot*robots + opShare;\n    } else {\n      const price = 1800000, life = 5;\n      const amort = price/life;\n      const service = price*0.12;\n      robo = (amort+service+elecPerRobot)*robots + opShare;\n    }\n    const economy = Math.max(0, manual - robo);\n    const savePct = manual>0 ? Math.round(economy/manual*100) : 0;\n    const invest = s.model==='buy' ? 1800000*robots : 0;\n    const paybackMonths = (s.model==='buy' && economy>0) ? Math.round(invest/(economy/12)) : 0;\n    const maxV = Math.max(manual, robo, 1);\n    const set = (k)=>(e)=>{ const v = e && e.target ? Number(e.target.value) : e; this.setState({[k]:v}); };\n    return {\n      obj:s.obj, area:s.area, areaFmt:this._fmt(s.area), workers:s.workers, wage:s.wage, wageFmt:this._fmt(s.wage), robots,\n      economyFmt:this._fmt(economy), savePct, manualFmt:this._fmt(manual), roboFmt:this._fmt(robo),\n      paybackTxt: (s.model==='buy'&&paybackMonths>0)? (' · окупаемость ≈ '+paybackMonths+' мес.') : '',\n      barNow:'width:'+Math.round(manual/maxV*100)+'%',\n      barRobo:'width:'+Math.round(robo/maxV*100)+'%',\n      modeDay: s.mode==='day'?'on':'', modeNight: s.mode==='night'?'on':'', modeAll: s.mode==='all'?'on':'',\n      modelRent: s.model==='rent'?'on':'', modelBuy: s.model==='buy'?'on':'',\n      onObj:(e)=>this.setState({obj:e.target.value}),\n      onArea:set('area'), onWorkers:set('workers'), onWage:set('wage'),\n      setDay:()=>this.setState({mode:'day'}), setNight:()=>this.setState({mode:'night'}), setAll:()=>this.setState({mode:'all'}),\n      setRent:()=>this.setState({model:'rent'}), setBuy:()=>this.setState({model:'buy'})\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
