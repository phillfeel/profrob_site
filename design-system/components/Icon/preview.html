<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Icon — превью</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></head>
<body>
<div id="root" class="pr-row"></div>
<script>
  var P = window.Profrobot, h = React.createElement, F = React.Fragment;
  var names = ['arrow-right','arrow-up-right','plus','minus','check','menu','close','chevron-down','play','phone','mail'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null, names.map(function (n) {
    return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', minWidth: '56px' } },
      h(P.Icon, { name: n, size: 24 }),
      h('span', { style: { font: '400 11px/14px var(--font-mono)', color: 'var(--ink-muted)', whiteSpace: 'nowrap' } }, n));
  })));
</script>
</body>
</html>
