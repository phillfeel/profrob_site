<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Badge — превью</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></head>
<body>
<div id="root" class="pr-row"></div>
<script>
  var P = window.Profrobot, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(P.Badge, { tone: 'success' }, 'Система онлайн'),
    h(P.Badge, { tone: 'neutral' }, 'В наличии'),
    h(P.Badge, { tone: 'accent' }, 'Новинка'),
    h(P.Badge, { tone: 'warning' }, 'Обслуживание'),
    h(P.Badge, { tone: 'danger' }, 'Офлайн'),
    h(P.Badge, { tone: 'lime', dot: false }, 'ROI 14 мес')));
</script>
</body>
</html>
