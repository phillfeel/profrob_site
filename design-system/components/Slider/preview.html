<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Slider — превью</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></head>
<body>
<div id="root" class="pr-row" style="gap:48px;padding:32px"></div>
<script>
  var P = window.Profrobot, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h('div', { style: { width: '360px' } }, h(P.Slider, { label: 'Площадь объекта', min: 1000, max: 50000, step: 500, defaultValue: 12000, unit: 'м²' })),
    h('div', { style: { width: '360px' } }, h(P.Slider, { label: 'Уборок в сутки', min: 1, max: 6, defaultValue: 2 }))));
</script>
</body>
</html>
