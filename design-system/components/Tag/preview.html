<body>
<div id="root" class=""></div>
<script>
  var P = window.Profrobot, h = React.createElement, F = React.Fragment;
  var t = ['Сервис','Ресепшн','Уборка','Доставка','Склад','Инспекция'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h('div', { className: 'pr-row' }, t.map(function (x) { return h(P.Tag, { key: x }, x); })),
