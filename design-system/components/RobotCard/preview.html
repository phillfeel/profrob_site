<!doctype html>

<head><meta charset="utf-8"><title>RobotCard — превью</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></head>
<body>
<div id="root" class="pr-row" style="align-items:stretch;gap:24px"></div>
<script>
  var P = window.Profrobot, h = React.createElement, F = React.Fragment;

    h(P.RobotCard, { tag: 'Доставка', vendor: 'Keenon', name: 'Робот-доставщик T8', text: 'Три полки, 30 кг, объезд препятствий.',
      specs: [{ label: 'Грузоподъёмность', value: '30 кг' }, { label: 'Автономность', value: '12 ч' }], cta: 'Смотреть' })));
</script>
